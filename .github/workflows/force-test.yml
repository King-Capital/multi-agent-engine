name: Force Test Gate

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why force-test is needed (e.g. "PR #368 — scripts-only, no engine changes")'
        required: false
        default: 'No engine changes — satisfying required test check'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Test gate (no engine changes)
        run: |
          echo "::notice::Force test gate: ${{ github.event.inputs.reason }}"
          echo "✅ Required 'test' check satisfied — no engine/agents/configs changes in this branch"
