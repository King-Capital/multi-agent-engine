name: Force Test Gate

on:
  pull_request:
    paths-ignore:
      - 'engine/**'
      - 'agents/**'
      - 'configs/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why force-test is needed'
        required: false
        default: 'No engine changes — satisfying required test check'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Test gate (no engine changes)
        run: |
          echo "✅ Required 'test' check satisfied — no engine/agents/configs changes in this branch"
